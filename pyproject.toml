[project]
name = "algoritmo-canny"
version = "0.1.0"
description = "Implementação manual do detector de bordas de Canny usando NumPy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
visualization = ["matplotlib"]
dev = ["pytest", "ruff"]

[project.scripts]
algoritmo-canny = "algoritmo_canny.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algoritmo_canny"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
